modules:
  jira:issuePanel:
    - key: ctp-jira-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: ctp-jira
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0142e52f-e08d-4af1-a8e9-7fa3fbffc2f5
